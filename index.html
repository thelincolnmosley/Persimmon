<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f1cfb5">
<title>Persimmon</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cellipse cx='20' cy='22.5' rx='17' ry='15' fill='%23c45c14'/%3E%3Cellipse cx='19' cy='21.3' rx='15.4' ry='13.3' fill='%23f28c1f'/%3E%3Cpath d='M20 8l3.2 4 7.3-.5-5.3 4.3-5.2 2.4-5.2-2.4-5.3-4.3 7.3.5z' fill='%235d7c3a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body data-state="title">

<canvas id="scene"></canvas>
<div class="vignette"></div>
<div class="grain"></div>

<header class="hud">
  <div class="score">
    <output id="score">0</output>
    <span class="cap">score</span>
  </div>
  <div class="day">
    <span id="phase">morning</span>
    <span class="pips" id="pips"><i></i><i></i><i></i><i></i><i></i></span>
  </div>
</header>

<section class="card" id="title">
  <h1 aria-label="Persimmon"><span style="--i:0">P</span><span style="--i:1">e</span><span style="--i:2">r</span><span style="--i:3">s</span><span style="--i:4">i</span><span style="--i:5">m</span><span style="--i:6">m</span><span style="--i:7" class="o"><svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="22.5" rx="17" ry="15" fill="#c45c14"/><ellipse cx="19" cy="21.3" rx="15.4" ry="13.3" fill="#f28c1f"/><ellipse cx="12.6" cy="17" rx="4.4" ry="2.3" transform="rotate(-34 12.6 17)" fill="#ffc063"/><path d="M20 8.4l3.2 3.8 7.3-.6-5.3 4.2-5.2 2.2-5.2-2.2-5.3-4.2 7.3.6z" fill="#5d7c3a"/><ellipse cx="20" cy="12.6" rx="1.7" ry="1.3" fill="#6b4a2e"/></svg></span><span style="--i:8">n</span></h1>
  <p class="cap sub">a snake game in four lights</p>
</section>

<section class="card" id="over">
  <h2 id="overTitle">Tangled.</h2>
  <p class="cap line"><span id="overScore"></span><span id="overDay"></span><span id="overBest"></span></p>
</section>

<section class="card" id="paused">
  <h2>Paused.</h2>
</section>

<div class="keys" aria-hidden="true">
  <div class="plane" id="plane">
    <kbd class="u">&uarr;</kbd><kbd class="l">&larr;</kbd><kbd class="d">&darr;</kbd><kbd class="r">&rarr;</kbd>
  </div>
  <span class="cap" id="keysNote">arrows or wasd</span>
</div>

<p class="cap prompt"><span id="prompt">press space to begin</span></p>

<footer class="foot">
  <span class="cap" id="bestWrap" hidden>best <b id="best">0</b></span>
  <span class="cap hints"><span class="playhint">p &mdash; pause</span><button id="mute" type="button">sound on</button></span>
</footer>

<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
